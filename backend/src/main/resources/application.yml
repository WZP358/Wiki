server:
  port: 8080

spring:
  application:
    name: wiki-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wiki?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:wzp}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    port: ${MAIL_PORT:25}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

wiki:
  jwt-secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret-key-32b-plus}
  jwt-expire-hours: 24
  admin-bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:Admin@123456}
  admin-nickname: ${ADMIN_NICKNAME:平台管理员}
  demo-data-enabled: ${DEMO_DATA_ENABLED:true}
  verify-code-expire-minutes: 5
  verify-code-send-interval-seconds: 60
  recycle-reserve-days: 30
  draft-auto-save-seconds: 30
  local-storage-dir: ${LOCAL_STORAGE_DIR:./storage/docs}
  avatar-storage-dir: ${AVATAR_STORAGE_DIR:./storage/avatars}
  doc-image-storage-dir: ${DOC_IMAGE_STORAGE_DIR:./storage/doc-images}
  sms-enabled: false
  sms-gateway-url: ${SMS_GATEWAY_URL:}
  sms-api-key: ${SMS_API_KEY:}
  cloud-cleanup-enabled: false
  cloud-cleanup-url: ${CLOUD_CLEANUP_URL:}
  cloud-cleanup-api-key: ${CLOUD_CLEANUP_API_KEY:}
