<h1>端口占用排查</h1>
<h2>业务背景</h2>
<p>定位 8080、5173、5181、5184 等端口占用并确认进程来源。</p>
<h2>适用范围</h2>
<p>本文档适用于「运维部署与应急知识库」相关成员，用于统一流程、标准和演示口径。</p>
<h2>操作要点</h2>
<ul>
<li>明确负责人、参与人和验收标准。</li>
<li>关键变更需要在知识库中沉淀版本记录。</li>
<li>涉及权限、发布或客户影响的事项必须保留审计线索。</li>
</ul>
<h2>演示建议</h2>
<p>展示时可以切换不同账号，观察知识库可见性、文档目录、评论收藏和后台审计数据。</p>
